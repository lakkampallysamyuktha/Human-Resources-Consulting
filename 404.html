<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#092328">
    <meta name="description" content="Page not found — Stackly Human Resources Consulting.">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Stackly Human Resources Consulting</title>
    <link rel="stylesheet" href="global.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        /* ==========================================================================
           404 — Page-specific styles
           Centered layout, no header/footer navigation, 2 recovery buttons.
           ========================================================================== */

        .notfound-page {
            background: var(--hr-deep);
            color: var(--hr-cream);
            min-height: 100svh;
            margin: 0;
            overflow-x: clip;
        }

        .nf-hero {
            position: relative;
            min-height: 100svh;
            padding: 40px 24px;
            background: var(--hr-deep);
            color: var(--hr-cream);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nf-hero__bg {
            position: absolute;
            inset: -10%;
            background-image:
                linear-gradient(rgba(139, 187, 146, .07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 187, 146, .07) 1px, transparent 1px);
            background-size: 80px 80px;
            transform: rotate(-4deg);
            opacity: .85;
            pointer-events: none;
        }

        .nf-hero__inner {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            margin-inline: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .nf-brand {
            display: inline-block;
            margin-bottom: 24px;
        }

        .nf-brand img {
            width: 120px;
            height: auto;
            filter: brightness(0) invert(1);
        }

        .nf-eyebrow {
            color: var(--hr-sage);
            justify-content: center;
            margin-bottom: 12px;
        }

        .nf-code {
            margin: 0 0 12px;
            font-family: var(--display);
            font-weight: 500;
            font-size: clamp(5rem, 14vw, 9.5rem);
            line-height: .86;
            letter-spacing: -.055em;
            color: var(--hr-cream);
        }

        .nf-code em {
            font-style: italic;
            font-weight: 500;
            color: var(--hr-sage);
        }

        .nf-title {
            margin: 12px 0 0;
            font-family: var(--display);
            font-weight: 500;
            font-size: clamp(1.8rem, 3.5vw, 2.7rem);
            line-height: 1.12;
            letter-spacing: -.02em;
            color: var(--hr-cream);
            max-width: 600px;
        }

        .nf-lede {
            margin: 20px 0 0;
            max-width: 520px;
            color: rgba(245, 248, 244, .74);
            font-size: clamp(.95rem, 1.1vw, 1.05rem);
            line-height: 1.7;
        }

        .nf-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 36px;
        }

        .nf-actions .btn {
            min-height: 48px;
            padding: 0 24px;
            cursor: pointer;
        }

        .nf-actions .btn--light:hover {
            background: var(--hr-sage);
            border-color: var(--hr-sage);
            color: var(--hr-deep);
        }

        .nf-actions .btn--outline {
            background: transparent;
            border: 1px solid rgba(245, 248, 244, .4);
            color: var(--hr-cream);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            transition: background .3s ease, border-color .3s ease, color .3s ease;
        }

        .nf-actions .btn--outline:hover {
            background: var(--hr-sage);
            border-color: var(--hr-sage);
            color: var(--hr-deep);
        }

        @media (max-width: 520px) {
            .nf-hero {
                padding: 30px 16px;
            }

            .nf-brand img {
                width: 100px;
            }

            .nf-actions {
                flex-direction: column;
                width: 100%;
            }

            .nf-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nf-actions .btn--outline {
                transition: none;
            }
        }
    </style>
</head>

<body class="notfound-page">
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main">
        <section class="nf-hero" aria-labelledby="nfTitle">
            <div class="nf-hero__bg" aria-hidden="true"></div>
            <div class="nf-hero__inner">
                <a class="nf-brand reveal-up" href="index.html" aria-label="Stackly home">
                    <img src="logo.webp" alt="Stackly">
                </a>
                <p class="eyebrow nf-eyebrow reveal-up">Error 404 · Off the map</p>
                <p class="nf-code reveal-up" aria-hidden="true">4<em>0</em>4</p>
                <h1 class="nf-title reveal-up" id="nfTitle">This page isn't here — but we are.</h1>
                <p class="nf-lede reveal-up">The link you followed may be broken, or the page may have been moved. Whichever way you arrived, there is a clearer path back into the practice.</p>
                <div class="nf-actions reveal-up">
                    <a class="btn btn--light" href="index.html">Return Home <span class="btn__arrow"><svg class="icon-arrow" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-bottom: 2px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span></a>
                    <button class="btn btn--outline" type="button" onclick="history.back()">Previous Page <span class="btn__arrow" aria-hidden="true"><svg class="icon-arrow" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-bottom: 2px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span></button>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (window.gsap && !reduce) {
                gsap.fromTo('.reveal-up', {
                    autoAlpha: 0,
                    y: 20
                }, {
                    autoAlpha: 1,
                    y: 0,
                    duration: 0.8,
                    stagger: 0.08,
                    ease: 'power3.out'
                });

                gsap.fromTo('.nf-hero__bg', { opacity: 0 }, {
                    opacity: 0.85,
                    duration: 1.4,
                    ease: 'power2.out'
                });
            } else {
                document.querySelectorAll('.reveal-up').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                });
            }
        });
    </script>
</body>

</html>
